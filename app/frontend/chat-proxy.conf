
# =============================================
# 1. Basic request-rate protection
# =============================================

limit_req_zone $binary_remote_addr zone=cm_chat:1m rate=6r/m;


# =============================================
# 2. Existing frontend HTTP server
# =============================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AWS VPC Route 53 DNS Resolver
    resolver 169.254.169.253 valid=10s ipv6=off;


    # =========================================
    # 3. Chat API reverse proxy
    # =========================================

    location = /assistant/chat {

        # Only permit POST requests
        limit_except POST {
            deny all;
        }

        # Limit request size and frequency
        client_max_body_size 16k;

        limit_req zone=cm_chat burst=3 nodelay;
        limit_req_status 429;

        # Dynamic lookup of the private ECS agent
        set $cloudmart_agent agent.cloudmart-dev-ai.internal;

        proxy_pass http://$cloudmart_agent:8080/invocations;

        proxy_http_version 1.1;

        proxy_set_header Host $cloudmart_agent;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 210s;

        proxy_buffering off;
    }


    # =========================================
    # 4. Existing storefront static files
    # =========================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}
