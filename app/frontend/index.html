<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudMart</title>
  <script src="version.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    li { margin: .4rem 0; }
    .desc { color: #555; font-size: .9rem; }
    #versions { color: #777; font-size: .85rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>CloudMart</h1>

  <h2>Products</h2>
  <ul id="products"></ul>

  <h2>Your cart</h2>
  <ul id="cart"></ul>
  <p id="cart-total"></p>
  <button id="checkout">Place order</button>
  <p id="order-result"></p>

  <p id="versions"></p>

  <script>
    const products = new Map();

    // Works on plain http (crypto.randomUUID needs https, getRandomValues does not)
    function newId() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    function cartId() {
      let id = localStorage.getItem("cloudmart-cart-id");
      if (!id) {
        id = newId();
        localStorage.setItem("cloudmart-cart-id", id);
      }
      return id;
    }

    async function api(path, options) {
      const res = await fetch(path, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
      return body;
    }

    function button(label, onClick) {
      const b = document.createElement("button");
      b.textContent = label;
      b.addEventListener("click", onClick);
      return b;
    }

    async function loadProducts() {
      const list = document.getElementById("products");
      list.textContent = "";
      try {
        for (const p of await api("/api/catalog/products")) {
          products.set(String(p.id), p);
          const li = document.createElement("li");
          li.append(p.name + " - $" + p.price.toFixed(2) + " ", button("Add to cart", () => addToCart(p.id)));
          const desc = document.createElement("div");
          desc.className = "desc";
          desc.textContent = p.description;
          li.appendChild(desc);
          list.appendChild(li);
        }
      } catch (e) {
        list.textContent = "Could not load products: " + e.message;
      }
    }

    async function loadCart() {
      const list = document.getElementById("cart");
      const totalEl = document.getElementById("cart-total");
      list.textContent = "";
      try {
        const cart = await api("/api/cart/" + cartId());
        let total = 0;
        for (const line of cart.items) {
          const p = products.get(String(line.product_id));
          total += (p ? p.price : 0) * line.qty;
          const li = document.createElement("li");
          li.append(
            line.qty + " x " + (p ? p.name : "Product " + line.product_id) + " ",
            button("Remove", () => removeFromCart(line.product_id))
          );
          list.appendChild(li);
        }
        totalEl.textContent = cart.items.length ? "Total: $" + total.toFixed(2) : "Your cart is empty";
      } catch (e) {
        totalEl.textContent = "Could not load cart: " + e.message;
      }
    }

    async function addToCart(productId) {
      await api("/api/cart/" + cartId() + "/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: String(productId), qty: 1 }),
      });
      loadCart();
    }

    async function removeFromCart(productId) {
      await fetch("/api/cart/" + cartId() + "/items/" + productId, { method: "DELETE" });
      loadCart();
    }

    document.getElementById("checkout").addEventListener("click", async () => {
      const result = document.getElementById("order-result");
      try {
        const order = await api("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cart_id: cartId() }),
        });
        result.textContent = "Order #" + order.id + " placed. Total: $" + order.total.toFixed(2);
      } catch (e) {
        result.textContent = "Could not place order: " + e.message;
      }
      loadCart();
    });

    async function showVersions() {
      const parts = ["frontend: " + (window.APP_VERSION || "dev")];
      for (const name of ["catalog", "cart", "orders"]) {
        try {
          parts.push(name + ": " + (await api("/api/" + name + "/version")).version);
        } catch (e) {
          parts.push(name + ": unknown");
        }
      }
      document.getElementById("versions").textContent = parts.join(" | ");
    }

    (async () => {
      await loadProducts();
      await loadCart();
      showVersions();
    })();
  </script>
</body>
</html>
