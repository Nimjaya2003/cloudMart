name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # manual "Run workflow" button: deploys every service

permissions:
  id-token: write # lets jobs request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # queue deployments, never cancel one mid-flight

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: cloudmart-dev-cluster

jobs:
  # ---------- 1. Test every Python service on its own ----------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, cart, orders]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/${{ matrix.service }}
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app/${{ matrix.service }}
        run: pytest -q

  # ---------- 2. Work out which services need deploying ----------
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so we can compare with the previous commit

      - name: Detect changed services
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          ALL=(frontend catalog cart orders)
          services=()

          # Manual runs, brand-new branches or an unreadable history: deploy everything
          if [ "$EVENT" = "workflow_dispatch" ] \
             || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null); then
            services=("${ALL[@]}")
          # A change to this workflow itself: redeploy everything
          elif grep -qxF ".github/workflows/deploy.yml" <<< "$changed"; then
            services=("${ALL[@]}")
          else
            for svc in "${ALL[@]}"; do
              if grep -q "^app/${svc}/" <<< "$changed"; then
                services+=("$svc")
              fi
            done
          fi

          if [ "${#services[@]}" -eq 0 ]; then
            json='[]'
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          fi

          echo "Services to deploy: $json"
          echo "services=$json" >> "$GITHUB_OUTPUT"

  # ---------- 3. Build, push and deploy each changed service ----------
  deploy:
    needs: [test, changes]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tagged with the commit SHA)
        id: build
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/cloudmart/${{ matrix.service }}:${{ github.sha }}
        run: |
          docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" app/${{ matrix.service }}
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition cloudmart-dev-${{ matrix.service }} \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS and wait until it is stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: cloudmart-dev-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test the live service
        run: |
          ALB=$(aws elbv2 describe-load-balancers --names cloudmart-dev-alb \
                  --query 'LoadBalancers[0].DNSName' --output text)
          EXPECTED="${GITHUB_SHA::7}"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            URL="http://$ALB/version.js"
          else
            URL="http://$ALB/api/${{ matrix.service }}/version"
          fi
          body=""
          for i in $(seq 1 10); do
            body=$(curl -s --max-time 5 "$URL" || true)
            if grep -q "$EXPECTED" <<< "$body"; then
              echo "OK: $URL reports version $EXPECTED"
              exit 0
            fi
            echo "Attempt $i: not serving $EXPECTED yet"
            sleep 6
          done
          echo "FAILED: $URL did not report $EXPECTED (last response: $body)"
          exit 1